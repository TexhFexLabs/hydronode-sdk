name: Tests

on:
  push:
  pull_request:

jobs:
  vectors:
    name: Test vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/generate_vectors.py && git diff --exit-code vectors/

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    # The official images: setup-python has no 3.8 for the current Ubuntu runner, the README promises 3.8+.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: python3 python/test_hydronode.py

  micropython:
    name: MicroPython
    runs-on: ubuntu-latest
    container: micropython/unix:latest
    steps:
      - uses: actions/checkout@v4
      - run: micropython python/test_hydronode.py

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test node/test.mjs

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: test -z "$(gofmt -l go)"
      - run: cd go && go vet ./... && go test ./...

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash shell/test.sh
